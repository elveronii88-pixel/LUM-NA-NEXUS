<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LUMINA NEXUS | Secure Access</title>
    <style>
        :root { --gold: #FFD700; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* Giriş Ekranı (Gate) */
        #access-gate { text-align: center; background: #0d0d0d; padding: 50px; border-radius: 20px; border: 1px solid #222; box-shadow: 0 0 50px rgba(0,0,0,1); transition: 0.5s; }
        .ls-logo { font-size: 3rem; font-weight: bold; letter-spacing: 10px; color: var(--gold); margin-bottom: 20px; }
        input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 15px; border-radius: 8px; width: 250px; text-align: center; font-size: 1.1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,215,0,0.2); }
        .btn-enter { background: var(--gold); color: black; border: none; padding: 15px 40px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; text-transform: uppercase; }
        
        /* Ana Sistem (Başlangıçta Gizli) */
        #nexus-main { display: none; width: 100%; height: 100vh; flex-direction: row; }
        /* ... Eski CSS yapıları buraya dahil edilecek ... */
    </style>
</head>
<body>

    <div id="access-gate">
        <div class="ls-logo">LUMINA NEXUS</div>
        <p style="color: #666; font-size: 0.8rem; margin-bottom: 30px;">KİMLİK DOĞRULAMASI GEREKLİ</p>
        <input type="password" id="master-key" placeholder="CEO ERIŞIM ANAHTARI">
        <br>
        <button class="btn-enter" onclick="validateAccess()">Sisteme Gir</button>
        <p id="error-msg" style="color: #ff4444; font-size: 0.8rem; margin-top: 15px; display: none;">YETKİSİZ ERİŞİM: KİMLİK DOĞRULANAMADI</p>
    </div>

    <div id="nexus-main">
        <h1 style="color:var(--gold); padding: 20px;">Hoş Geldiniz Sayın CEO Arel Ö.</h1>
    </div>

    <script>
        const KEY = "A+190788";

        function validateAccess() {
            const input = document.getElementById('master-key').value;
            const gate = document.getElementById('access-gate');
            const main = document.getElementById('nexus-main');
            const error = document.getElementById('error-msg');

            if(input === KEY) {
                gate.style.opacity = "0";
                setTimeout(() => {
                    gate.style.display = "none";
                    main.style.display = "flex";
                    // Terminal başlatma fonksiyonları buraya
                }, 500);
            } else {
                error.style.display = "block";
                document.getElementById('master-key').value = "";
                // Hatalı giriş logunu gizlice sunucuya gönder (Opsiyonel)
            }
        }
    </script>
</body>
</html>
