<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LUMINA NEXUS | Management OS</title>
    <style>
        :root { --gold: #FFD700; --bg: #050505; --card: #0d0d0d; --border: #222; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; }
        
        /* Yan Menü */
        .sidebar { width: 280px; background: var(--card); border-right: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; }
        .logo { font-weight: bold; letter-spacing: 5px; color: var(--gold); border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 30px; }
        
        /* Terminal Bölgesi */
        .main-content { flex: 1; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .terminal-box { background: black; border-radius: 10px; padding: 20px; flex: 1; border: 1px solid var(--gold); font-family: 'Courier New', monospace; overflow-y: auto; color: #0f0; }
        
        /* Kontrol Paneli */
        .control-panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .btn { background: var(--gold); color: black; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        input { background: #1a1a1a; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 5px; margin-right: 10px; }

        .ceo-only { border: 1px dashed var(--gold); padding: 15px; margin-top: 20px; border-radius: 8px; }
        .worker-list { list-style: none; padding: 0; }
        .worker-item { display: flex; justify-content: space-between; padding: 10px; background: #111; margin-bottom: 5px; border-radius: 4px; border-left: 3px solid var(--gold); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">LUMINA NEXUS</div>
        <p style="font-size: 0.8rem; color: #888;">STATUS: CONNECTED TO WEB</p>
        <div id="worker-count" style="margin-top: 20px;">Aktif Personel: 0</div>
        <ul id="worker-list-display" class="worker-list" style="margin-top: 15px; font-size: 0.85rem;"></ul>
    </div>

    <div class="main-content">
        <div class="terminal-box" id="nexus-terminal">
            <div>[SİSTEM] Lumina Nexus v2.0 Başlatıldı...</div>
            <div>[SİSTEM] Web sitesi veritabanı ile senkronizasyon kuruldu.</div>
            <div>[GÜVENLİK] CEO Yetkisi Gerekli.</div>
        </div>

        <div class="control-panel">
            <h3 style="margin-top:0;">CEO Yönetim Paneli (Arel Ö.)</h3>
            <div class="ceo-only">
                <input type="password" id="ceo-pass" placeholder="Yetki Şifresi">
                <input type="text" id="worker-name" placeholder="Personel Adı">
                <button class="btn" onclick="modifyWorker('add')">EKLE</button>
                <button class="btn" style="background: #ff4444;" onclick="modifyWorker('remove')">KALDIR</button>
            </div>
        </div>
    </div>

    <script>
        let workers = [];
        const terminal = document.getElementById('nexus-terminal');
        const CEO_PASS = "A+190788";

        function log(msg, color = "#0f0") {
            const time = new Date().toLocaleTimeString();
            terminal.innerHTML += `<div style="color: ${color}">[${time}] > ${msg}</div>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function modifyWorker(action) {
            const pass = document.getElementById('ceo-pass').value;
            const name = document.getElementById('worker-name').value;

            if (pass !== CEO_PASS) {
                log("HATA: YETKİSİZ ERİŞİM DENEMESİ! CEO ŞİFRESİ HATALI.", "#ff4444");
                return;
            }

            if (!name) return alert("İsim giriniz.");

            if (action === 'add') {
                workers.push(name);
                log(`PERSONEL EKLENDİ: ${name} (Web Entegrasyonu Tamamlandı)`);
            } else {
                workers = workers.filter(w => w !== name);
                log(`PERSONEL SİSTEMDEN ÇIKARTILDI: ${name}`, "#ff4444");
            }

            updateUI();
            document.getElementById('worker-name').value = "";
        }

        function updateUI() {
            const list = document.getElementById('worker-list-display');
            const count = document.getElementById('worker-count');
            list.innerHTML = workers.map(w => `<li class="worker-item">${w} <span>ONLINE</span></li>`).join('');
            count.innerText = `Aktif Personel: ${workers.length}`;
            
            // Web sitesi ile ilişkilendirme (Simülasyon)
            log("Veritabanı güncellendi: https://lumina-studios.com/api/nexus/sync");
        }
    </script>
</body>
</html>
